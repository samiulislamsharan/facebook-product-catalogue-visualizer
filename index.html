<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Multi-Format Product Catalogue Visualizer</title>

  <meta name="description"
    content="Instantly parse, visualize, and filter standard Facebook and Google product feeds (XML, CSV, XLSX) entirely client-side.">

  <meta name="google-site-verification" content="0B25r8YnJDfJiCTeBr1jgf_3GPlSlwxFaD3r07bWMis" />

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://<your-username>.github.io/xml-catalogue-visualizer/">
  <meta property="og:title" content="🛍️ Multi-Format Product Catalogue Visualizer">
  <meta property="og:description"
    content="Instantly parse, visualize, and filter standard Facebook and Google product feeds (XML, CSV, XLSX) entirely client-side. Zero server uploads required.">
  <meta property="og:image"
    content="https://images.unsplash.com/photo-1556742049-0a67b97c4164?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:site_name" content="Catalogue Visualizer">

  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://<your-username>.github.io/xml-catalogue-visualizer/">
  <meta property="twitter:title" content="🛍️ Multi-Format Product Catalogue Visualizer">
  <meta property="twitter:description"
    content="Instantly parse, visualize, and filter standard Facebook and Google product feeds (XML, CSV, XLSX) entirely client-side. Zero server uploads required.">
  <meta property="twitter:image"
    content="https://images.unsplash.com/photo-1556742049-0a67b97c4164?auto=format&fit=crop&w=1200&q=80">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.css"
    integrity="sha512-zylce7fP6h4usg536JBTRj2rt7q22Z0qicHSlgSK53Irtfkz37ate3KCQ59du+aXZV6R3yyL2X1LyGKBEUMZaw=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <link rel="stylesheet" href="./src/css/style.css">

  <script>
    const getStoredTheme = () => localStorage.getItem('theme');
    const setStoredTheme = theme => localStorage.setItem('theme', theme);

    const getPreferredTheme = () => {
      const storedTheme = getStoredTheme();
      if (storedTheme) return storedTheme;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    };

    const setTheme = theme => {
      document.documentElement.setAttribute('data-bs-theme', theme);
    };

    setTheme(getPreferredTheme());

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      const storedTheme = getStoredTheme();
      if (storedTheme !== 'light' && storedTheme !== 'dark') {
        const theme = getPreferredTheme();
        setTheme(theme);
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      }
    });

    window.toggleTheme = () => {
      const current = document.documentElement.getAttribute('data-bs-theme');
      const newTheme = current === 'dark' ? 'light' : 'dark';
      setStoredTheme(newTheme);
      setTheme(newTheme);
      const icon = document.getElementById('themeIcon');
      if (icon) icon.className = newTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    };

    document.addEventListener('DOMContentLoaded', () => {
      const current = document.documentElement.getAttribute('data-bs-theme');
      const icon = document.getElementById('themeIcon');
      if (icon) icon.className = current === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    });
  </script>
</head>
<body class="bg-body-tertiary">

  <header class="navbar navbar-dark bg-primary shadow-sm mb-4 py-3">
    <div class="container-fluid px-4">
      <span class="navbar-brand mb-0 h2 fw-bold"><i class="fa-solid fa-bag-shopping me-2"></i> Multi-Format
        Visualizer</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light d-none d-sm-inline" id="fileName">No feed loaded</span>
        <button class="btn btn-outline-light rounded-circle" onclick="toggleTheme()"
          style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;"
          title="Toggle Dark Mode">
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="container-fluid px-4 mb-4">
    <div class="card shadow-sm border-0">
      <div class="card-body d-flex flex-wrap align-items-center gap-3">
        <div class="d-flex align-items-center gap-2">
          <label for="fileInput" class="btn btn-primary m-0 px-4" id="fileBtnLabel">
            <i class="fa-solid fa-file-arrow-up me-2"></i>Upload Local File
          </label>
          <input type="file" id="fileInput" accept=".xml,.csv,.xlsx,.xls" class="d-none" />
        </div>

        <span class="text-muted fw-bold small text-uppercase mx-2">OR</span>

        <div class="d-flex flex-grow-1 gap-2">
          <input type="url" id="urlInput" class="form-control" placeholder="Paste feed URL (.xml, .csv, .xlsx)..." />
          <button class="btn btn-outline-primary text-nowrap px-4" id="fetchUrlBtn" onclick="fetchFeedFromUrl()">
            <i class="fa-solid fa-cloud-arrow-down me-2"></i>Import Link
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid px-4">
    <div class="row">
      <aside class="col-lg-3 col-md-4 mb-4">
        <div class="card shadow-sm border-0 mb-3">
          <div class="card-body text-center py-4">
            <h2 class="display-4 text-primary fw-bold mb-0" id="totalCount">0</h2>
            <p class="text-muted mb-0 text-uppercase small fw-bold mt-2">Total Products</p>
          </div>
        </div>

        <div class="card shadow-sm border-0 mb-3 bg-danger bg-opacity-10 d-none" id="diagnosticsCard">
          <div class="card-body">
            <h5 class="card-title mb-2 fw-bold text-danger"><i class="fa-solid fa-triangle-exclamation me-2"></i>
              Feed Issues
            </h5>
            <p class="small text-danger mb-3">Found <span id="issueCount" class="fw-bold">0</span> products with missing
              critical fields.</p>
            <button class="btn btn-sm btn-danger w-100 fw-bold" onclick="filterCategory('ISSUES')">
              View Problematic Items
            </button>
          </div>
        </div>

        <div class="card shadow-sm border-0 mb-3">
          <div class="card-body">
            <h5 class="card-title mb-3 fw-bold">Sort By</h5>
            <select class="form-select" id="sortSelect" onchange="applyFilters()">
              <option value="default">Default</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="discount-desc">Biggest Discount</option>
              <option value="title-asc">Title: A to Z</option>
              <option value="title-desc">Title: Z to A</option>
            </select>
          </div>
        </div>

        <div class="card shadow-sm border-0 mb-3">
          <div class="card-body">
            <h5 class="card-title mb-3 fw-bold">Filters</h5>

            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="inStockOnly" onchange="applyFilters()">
              <label class="form-check-label" for="inStockOnly">In Stock Only</label>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold small text-muted text-uppercase mb-1">Price Range</label>
              <div class="d-flex gap-2 align-items-center">
                <input type="number" class="form-control form-control-sm" id="minPrice" placeholder="Min"
                  oninput="handleSearch()">
                <span class="text-muted">-</span>
                <input type="number" class="form-control form-control-sm" id="maxPrice" placeholder="Max"
                  oninput="handleSearch()">
              </div>
            </div>

            <div>
              <label class="form-label fw-bold small text-muted text-uppercase mb-1">Brands</label>
              <div id="brandsList" class="border rounded p-2 bg-body-tertiary"
                style="max-height: 150px; overflow-y: auto; font-size: 0.85rem;">
                <span class="text-muted">No brands available</span>
              </div>
            </div>
          </div>
        </div>

        <div class="card shadow-sm border-0 mb-3">
          <div class="card-body">
            <div class="mb-4">
              <input type="text" id="searchInput" class="form-control form-control-lg"
                placeholder="Search by title or ID..." oninput="handleSearch()" />
            </div>
            <h5 class="card-title mb-3 fw-bold">Categories</h5>
            <ul class="list-group list-group-flush" id="categoryTree">
              <li
                class="list-group-item d-flex justify-content-between align-items-center active list-group-item-action"
                data-path="All" onclick="filterCategory('All')" style="cursor:pointer; border-radius: 6px;">
                All Products
                <span class="badge text-bg-secondary rounded-pill" id="badgeAll">0</span>
              </li>
            </ul>
          </div>
        </div>
      </aside>

      <main class="col-lg-9 col-md-8">
        <div class="row g-4" id="productsGrid">
          <div class="col-12">
            <div class="text-center py-5 text-muted bg-body rounded shadow-sm">
              <i class="fa-solid fa-box-open fa-4x mb-3 text-secondary opacity-50"></i>
              <h3>No products loaded</h3>
              <p>Upload a file or paste a direct feed URL to begin.</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/js/all.js"
    integrity="sha512-YbiNgTNv2GVfwJwqGr9Xv9xWzPIEwaDOv3f2S6HFbRVeo/xuM87nKqkmBPctPP3sbvxv3EpNIRss+3gjEJbVrA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.js"
    integrity="sha512-GKxQGmCBqm3YHCZTdqD3Bvsz+AHRObqztq6xDo+68527RxgVw7wF1TR5ZSBvtWiz5qzpOzUGGvxJbT/6UzzSOQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./src/js/script.js"></script>
</body>
</html>
